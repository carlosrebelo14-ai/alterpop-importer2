# Deploy de produção (alterpop-importer-app), disparado à mão: Actions → deploy → Run workflow.
#
# Ordem, parando no primeiro passo que falhar:
#   1. bash scripts/deploy.sh   guardas (main limpo e igual a origin/main), test:franchise,
#                               test:sync-safety, test:health-gate, depois `flyctl deploy`
#   2. catalog:health na Fly    sai com erro se algum check estiver vermelho; se houver uma indexação a
#                               decorrer, espera até 15 min antes de avaliar (scripts/ci/maintenance.sh)
#   3. db:push na Fly           só corre com a saúde verde (passo 2) e sem indexação a decorrer
#
# O job usa o environment "production": se o environment tiver revisores obrigatórios, o GitHub pede
# aprovação antes de o job arrancar. Os diagnósticos e a limpeza de tags passaram para o workflow
# `maintenance`.
#
# Input skip_deploy (boolean, default false): com true salta o passo 1 (e a instalação de dependências que
# só ele usa) e corre só catalog:health e db:push, sem refazer o deploy.
#
# PRICE_MODE e THEME_GUARD NÃO são tocados aqui: as flags continuam como estão na Fly.
# Só se corre a partir de main (a guarda 1 do deploy.sh exige o branch main).
#
# Decisão 28: nenhuma sessão `flyctl ssh console` com Prisma pode correr em paralelo com uma
# publicação ou outra escrita em massa no SQLite do volume.
#
# Precisa do secret de repositório FLY_API_TOKEN (Settings → Secrets and variables → Actions).
# O token tem de poder fazer `flyctl ssh console` na app, além de `flyctl deploy`.
name: deploy

on:
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: "Saltar o deploy e correr só catalog:health e db:push"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      SKIP_DEPLOY: ${{ inputs.skip_deploy == true || inputs.skip_deploy == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: env.SKIP_DEPLOY != 'true'
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        if: env.SKIP_DEPLOY != 'true'
        run: npm ci

      - name: Gerar cliente Prisma
        if: env.SKIP_DEPLOY != 'true'
        run: npx prisma generate

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy (scripts/deploy.sh)
        if: env.SKIP_DEPLOY != 'true'
        run: bash scripts/deploy.sh

      - name: Saúde do catálogo na Fly (catalog:health, espera por indexação)
        run: bash scripts/ci/maintenance.sh catalog_health dry-run

      - name: Esquema na Fly (db:push, sem indexação a decorrer)
        run: bash scripts/ci/maintenance.sh db_push execute
