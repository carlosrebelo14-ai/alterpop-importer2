# Operações pontuais na Fly do PR 4 (Characters), disparadas à mão: Actions → fly-ops → Run workflow.
#
# comando  lista fechada, nunca texto livre. O db:push NÃO está aqui: corre só pela tarefa db_push
#          do workflow maintenance (Decisão 34, linha em docs/execucoes.md).
#   b1-dry        character-links-backfill.js --mode store (dry-run)
#   b2-dry        character-links-backfill.js --mode resolver (dry-run)
#   census-c      character-census.js (read-only, limiar 1)
#   verify-base   verify-character-invariants.js --baseline (read-only)
#   b1-execute    dry-run e depois --execute de B1, no mesmo job. Escreve só em ProductCharacter.
#   b2-execute    dry-run e depois --execute de B2, no mesmo job, com filtro LOTR. Escreve só em ProductCharacter.
#   candidates-dry    candidatos a personagem por universo, só leitura (28/10/2026). Saída ao arquiteto.
#   approve-dry   aprovação por personagem (character-approve.js), dry-run só leitura (04/11/2026). Sem custos no log.
#   revert-dry    reversão da aprovação por personagem, dry-run só leitura (04/11/2026).
#   approve-execute   aprovação por personagem (05/11/2026). Um só job: seleção, banda ±band_pct sobre
#                     reference_count; fora da banda falha sem escrever; dentro, aprova com o N atual.
#                     Escreve na fila (APPROVED). Não publica. Environment production.
#   revert-execute    reversão pela origem character-import-2026-11-04, com confirm_count exato.
#                     Só com OK do arquiteto. Environment production.
#   health-dry        portão de saúde (pre-pilot-verify) só leitura, com o detalhe por registo (29/10/2026).
#   tags-dry      tags-cleanup.js sem --execute: contagem por tag fora da lista, só leitura (28/10/2026).
#   tags-execute  tags-cleanup.js --execute: remove só TAGS_PARA_REMOVER; recusa se houver tags fora (28/10/2026).
#   cycle-apply-once  primeiro ciclo de personagens com a trava levantada uma vez (27/10/2026). Imprime o plano,
#                     aborta sem escrever se houver ação fora das classes autorizadas. Escreve na loja.
#
# Os dois --execute foram aprovados pelo arquiteto (27/10/2026). cycle-apply-once também.
# Nenhum dos dois escreve na loja. A aprovação do environment production é o gate.
# Leitura (b1-dry, b2-dry, census-c, verify-base, candidates-dry) usa o environment production-read,
# sem required reviewers (decisão do Carlos, 28/10/2026). Escrita (b1-execute, b2-execute,
# cycle-apply-once) fica em production, com aprovação. Teste: scripts/tests/flyops-environment.test.js.
#
# Saída completa no log do job e como artefacto (fly-ops-<comando>, 30 dias).
# Precisa do secret FLY_API_TOKEN (já existe) e dos environments "production" e "production-read".
# Só corre a partir de main (ver a guarda do job).
name: fly-ops

on:
  workflow_dispatch:
    inputs:
      comando:
        description: "Comando (lista fechada)"
        type: choice
        required: true
        options:
          - b1-dry
          - b2-dry
          - census-c
          - verify-base
          - b1-execute
          - b2-execute
          - cycle-apply-once
          - candidates-dry
          - tags-dry
          - tags-execute
          - health-dry
          - approve-dry
          - revert-dry
          - approve-execute
          - revert-execute
      reference_count:
        description: "approve-execute: N do dry-run aceite (inteiro)"
        type: string
        required: false
      band_pct:
        description: "approve-execute: banda em % sobre reference_count"
        type: string
        required: false
        default: "2"
      confirm_count:
        description: "revert-execute: número exato a reverter"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  fly-ops:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Leitura usa production-read (sem required reviewers, mesmo FLY_API_TOKEN). Escrita fica em production.
    environment: ${{ contains(fromJSON('["b1-dry","b2-dry","census-c","verify-base","candidates-dry","tags-dry","health-dry","approve-dry","revert-dry"]'), inputs.comando) && 'production-read' || 'production' }}
    timeout-minutes: 60
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      COMANDO: ${{ inputs.comando }}
      REFERENCE_COUNT: ${{ inputs.reference_count }}
      BAND_PCT: ${{ inputs.band_pct }}
      CONFIRM_COUNT: ${{ inputs.confirm_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Executar comando na Fly
        shell: bash
        run: |
          set -o pipefail
          case "$COMANDO" in
            b1-dry)     CMD='node scripts/catalog/character-links-backfill.js --mode store' ;;
            b2-dry)     CMD='node scripts/catalog/character-links-backfill.js --mode resolver' ;;
            census-c)   CMD='node scripts/catalog/character-census.js' ;;
            verify-base) CMD='node scripts/verify-character-invariants.js --baseline' ;;
            b1-execute) CMD='node scripts/catalog/character-links-backfill.js --mode store && node scripts/catalog/character-links-backfill.js --mode store --execute' ;;
            b2-execute) CMD='node scripts/catalog/character-links-backfill.js --mode resolver && node scripts/catalog/character-links-backfill.js --mode resolver --execute' ;;
            cycle-apply-once) CMD='node scripts/catalog/character-cycle-apply-once.js' ;;
            candidates-dry) CMD='node scripts/catalog/character-candidates.js' ;;
            tags-dry)   CMD='node scripts/catalog/tags-cleanup.js' ;;
            tags-execute) CMD='node scripts/catalog/tags-cleanup.js --execute' ;;
            # health-dry: detalhe por registo. Handles e SKUs são dados públicos da loja (decisão do arquiteto, 27/10 e 29/10).
            # Continuam fora do log: custos, margens, variáveis de ambiente, URLs internas.
            # O repositório é público: handles e GIDs não entram no log. Só ficam as verificações e contagens.
            health-dry) CMD='node scripts/catalog/pre-pilot-verify.js' ;;
            approve-dry) CMD='node scripts/catalog/character-approve.js' ;;
            revert-dry) CMD='node scripts/catalog/character-approve-revert.js' ;;
            # Os inputs só entram no comando depois de validados como número (o comando corre num shell remoto).
            approve-execute)
              [[ "$REFERENCE_COUNT" =~ ^[0-9]+$ ]] || { echo "reference_count obrigatório e inteiro (recebi '$REFERENCE_COUNT')" >&2; exit 64; }
              [[ "${BAND_PCT:-2}" =~ ^[0-9]+(\.[0-9]+)?$ ]] || { echo "band_pct tem de ser um número (recebi '$BAND_PCT')" >&2; exit 64; }
              CMD="node scripts/catalog/character-approve.js --execute --reference-count $REFERENCE_COUNT --band-pct ${BAND_PCT:-2}" ;;
            revert-execute)
              [[ "$CONFIRM_COUNT" =~ ^[0-9]+$ ]] || { echo "confirm_count obrigatório e inteiro (recebi '$CONFIRM_COUNT')" >&2; exit 64; }
              CMD="node scripts/catalog/character-approve-revert.js --execute --confirm-count $CONFIRM_COUNT" ;;
            *) echo "comando desconhecido: $COMANDO" >&2; exit 64 ;;
          esac
          mkdir -p "$RUNNER_TEMP/fly-ops"
          flyctl ssh console -a alterpop-importer-app -C "sh -lc 'cd /app && $CMD'" 2>&1 | tee "$RUNNER_TEMP/fly-ops/saida.txt"

      # Resumo legível pela API (check-runs/annotations). Só contagens, nomes de personagem e handles.
      # Sem GIDs, custos, margens, variáveis de ambiente ou URLs (guarda de 27/10 e 29/10/2026).
      - name: Anotar resumo na execução
        if: always()
        shell: bash
        run: |
          f="$RUNNER_TEMP/fly-ops/saida.txt"
          [ -f "$f" ] || exit 0
          {
            grep -E '^(ações|trava|produtos|-- |=== |aplicado|nada a aplicar|FORA|ERRO|banda|dentro da banda|PARADO|aprovados|ignorados|falhados|revertidos|  product-update |  (create|reactivate|update|set-draft) |  (✓|✗|!) )' "$f"
            sed -nE 's/^  ([a-z0-9-]+) · ([a-z]+): .*· (\+[0-9]+ -[0-9]+)$/  \1 · \2 \3/p; s/^  ([a-z0-9-]+) · status: .*depois=([A-Z]+)$/  \1 · status \2/p' "$f"
          } | while IFS= read -r linha; do
            echo "::notice title=${COMANDO}::${linha}"
          done || true

      - name: Guardar saída como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fly-ops-${{ inputs.comando }}
          path: ${{ runner.temp }}/fly-ops/saida.txt
          retention-days: 30
          if-no-files-found: warn
