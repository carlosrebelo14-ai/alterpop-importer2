# fly.toml app configuration file for alterpop-importer
# Learn more at https://fly.io/docs/reference/configuration/

app = "alterpop-importer-app"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  DATABASE_URL = "file:/app/data/dev.sqlite"
  SHOPIFY_SHOP_URL = "jyr17t-wr.myshopify.com"
  SHOPIFY_APP_URL = "https://alterpop-importer-app.fly.dev"
  APP_URL = "https://alterpop-importer-app.fly.dev"
  # DRY_RUN removido a 2026-08-04: nunca protegeu o publish (shopifyApprovedSync não
  # consulta a flag), mas bloqueava runImport — o caminho que o daemon de sync usa.
  # envBool("DRY_RUN", false) tem default false, por isso ausente == desligado.
  TRANSLATION_PROVIDER = "libretranslate"
  LIBRETRANSLATE_URL = "https://alterpop-libretranslate.fly.dev"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "sqlite_data"
  destination = "/app/data"

