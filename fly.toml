# fly.toml app configuration file generated for alterpop-importer2 on 2026-07-28T11:32:56Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'alterpop-importer2'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[env]
  DATABASE_URL = 'file:/app/data/dev.sqlite'
  DRY_RUN = 'true'
  NODE_ENV = 'production'
  PORT = '3000'
  SHOPIFY_SHOP_URL = 'jyr17t-wr.myshopify.com'

[[mounts]]
  source = 'sqlite_data'
  destination = '/app/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
